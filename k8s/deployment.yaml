apiVersion: apps/v1
kind: Deployment
metadata:
  name: dogni-back
  labels:
    app: dogni-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dogni-back
  template:
    metadata:
      labels:
        app: dogni-back
    spec:
      containers:
        - name: dogni-back
          image: ghcr.io/TU_USUARIO/TU_REPO:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: dogni-secrets
                  key: mongo_url
